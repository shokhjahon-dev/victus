<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiqa - 3D Kashf Eting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1eb2a6 0%, #0099cc 50%, #67b279 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* O'zbek bayrog'i ranglari aksentlari */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1eb2a6 0%, #ffffff 33%, #ffffff 66%, #67b279 100%);
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .content {
            color: white;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 0%, #e8f4f8 100%);
            color: #0099cc;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            background: #ffffff;
        }

        .description {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            border-left: 4px solid #ffffff;
        }

        .description strong {
            color: #ffffff;
            font-size: 1.1rem;
        }

        /* Musiqa grafika */
        .visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        /* Nota belgisi */
        .music-note-container {
            position: relative;
            width: 280px;
            height: 330px;
            animation: float 5s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Pastki nota boshi - Yashil */
        .note-circle-bottom {
            position: absolute;
            width: 140px;
            height: 105px;
            background: linear-gradient(145deg, #67b279 0%, #5fb76c 50%, #4a9060 100%);
            border-radius: 50%;
            bottom: 85px;
            left: 35px;
            transform: rotate(-25deg);
            box-shadow: 
                0 15px 40px rgba(103, 178, 121, 0.5),
                inset -5px -5px 15px rgba(0, 0, 0, 0.2),
                inset 5px 5px 15px rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .note-circle-bottom::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 25%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Yuqori nota boshi - Ko'k */
        .note-circle-top {
            position: absolute;
            width: 120px;
            height: 90px;
            background: linear-gradient(145deg, #1eb2a6 0%, #0099cc 50%, #0d8a9f 100%);
            border-radius: 50%;
            top: 55px;
            left: 75px;
            transform: rotate(15deg);
            box-shadow: 
                0 15px 40px rgba(30, 178, 166, 0.5),
                inset -5px -5px 15px rgba(0, 0, 0, 0.2),
                inset 5px 5px 15px rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .note-circle-top::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 25%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Nota chizig'i - Oq bilan gradient */
        .note-bar {
            position: absolute;
            width: 20px;
            height: 190px;
            background: linear-gradient(180deg, #ffffff 0%, #e8f4f8 30%, #1eb2a6 70%, #0099cc 100%);
            border-radius: 10px;
            top: 35px;
            right: 45px;
            box-shadow: 
                0 10px 30px rgba(255, 255, 255, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* Qizil aktsent - nota uchida */
        .note-flag {
            position: absolute;
            width: 50px;
            height: 35px;
            background: linear-gradient(135deg, #cc0000 0%, #ff4444 100%);
            border-radius: 0 50% 50% 0;
            top: 30px;
            right: 25px;
            box-shadow: 
                0 5px 15px rgba(204, 0, 0, 0.5),
                inset 2px 2px 5px rgba(255, 255, 255, 0.2);
        }

        /* Dekorativ doira - O'zbek naqshi */
        .decorative-circle {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 50%;
            right: -60px;
            transform: translateY(-50%);
            z-index: 1;
            animation: rotateCircle 30s linear infinite;
        }

        @keyframes rotateCircle {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .circle-pattern {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .pattern-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* O'zbek milliy naqshi */
        .circle-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background-image: 
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 15deg,
                    rgba(255, 255, 255, 0.2) 15deg 30deg
                );
            mask-image: radial-gradient(circle, transparent 35%, black 38%, black 100%);
        }

        /* Milliy bezak */
        .ornament {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50% 50% 0 50%;
        }

        .ornament-1 {
            top: -15px;
            right: 70px;
            transform: rotate(45deg);
        }

        .ornament-2 {
            top: 70px;
            right: -15px;
            transform: rotate(135deg);
        }

        .ornament-3 {
            bottom: 70px;
            right: -15px;
            transform: rotate(225deg);
        }

        .ornament-4 {
            bottom: -15px;
            right: 70px;
            transform: rotate(315deg);
        }

        /* Ma'lumot kartochkalari */
        .info-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .info-card h3 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .info-card p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        /* Bayroq ranglari - kartochkalar */
        .info-card:nth-child(1) { border-left: 5px solid #1eb2a6; }
        .info-card:nth-child(2) { border-left: 5px solid #ffffff; }
        .info-card:nth-child(3) { border-left: 5px solid #67b279; }
        .info-card:nth-child(4) { border-left: 5px solid #cc0000; }

        /* Responsive */
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 30px;
            }

            h1 {
                font-size: 3.5rem;
                text-align: center;
            }

            .subtitle {
                text-align: center;
            }

            .content {
                text-align: center;
            }

            .visual {
                order: -1;
            }

            .decorative-circle {
                right: 50%;
                transform: translate(50%, -50%);
            }

            .info-section {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }

            .button {
                font-size: 1.2rem;
                padding: 15px 35px;
            }

            .decorative-circle {
                width: 220px;
                height: 220px;
            }

            .music-note-container {
                width: 240px;
                height: 290px;
            }

            .note-circle-bottom {
                width: 120px;
                height: 90px;
            }

            .note-circle-top {
                width: 100px;
                height: 75px;
            }

            .note-bar {
                height: 160px;
                width: 18px;
            }

            .note-flag {
                width: 40px;
                height: 28px;
            }

            .info-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>MUSIQA</h1>
            <p class="subtitle">Musiqa Olamini 3D da Kashf Eting</p>
            
            <a href="https://musiclab.chromeexperiments.com" class="button">
                3D Kashf Eting
            </a>

            <div class="description">
                <strong>Bu sizga musiqani yaratish, chalish va tushunish imkonini beradi!</strong>
                <br><br>
                Interaktiv musiqa laboratoriyasida turli asboblarni sinab ko'ring va o'z musiqangizni yarating.
            </div>
        </div>

        <div class="visual">
            <div class="music-note-container">
                <div class="note-circle-bottom"></div>
                <div class="note-circle-top"></div>
                <div class="note-bar"></div>
                <div class="note-flag"></div>
            </div>

            <div class="decorative-circle">
                <div class="circle-pattern">
                    <div class="pattern-inner"></div>
                </div>
                <div class="ornament ornament-1"></div>
                <div class="ornament ornament-2"></div>
                <div class="ornament ornament-3"></div>
                <div class="ornament ornament-4"></div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-card">
                <h3>7</h3>
                <p>Nota belgilari</p>
            </div>
            <div class="info-card">
                <h3>88</h3>
                <p>Piano tugmalari</p>
            </div>
            <div class="info-card">
                <h3>12</h3>
                <p>Musiqiy tonlar</p>
            </div>
            <div class="info-card">
                <h3>🎵</h3>
                <p>O'zbek Musiqasi</p>
            </div>
        </div>
    </div>
</body>
</html>
