<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografiya - 3D Kashf Eting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1eb2a6 0%, #0099cc 50%, #67b279 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* O'zbek bayrog'i ranglari aksentlari */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1eb2a6 0%, #ffffff 33%, #ffffff 66%, #67b279 100%);
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .content {
            color: white;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 0%, #e8f4f8 100%);
            color: #0099cc;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            background: #ffffff;
        }

        .description {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            border-left: 4px solid #ffffff;
        }

        .description strong {
            color: #ffffff;
            font-size: 1.1rem;
        }

        /* Globus */
        .visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .globe-container {
            position: relative;
            z-index: 2;
            width: 280px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .globe {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
            background: linear-gradient(135deg, #67b279 0%, #1eb2a6 40%, #0099cc 100%);
            box-shadow: 
                -20px 20px 60px rgba(0, 0, 0, 0.4),
                inset -15px -15px 30px rgba(0, 0, 0, 0.3),
                inset 15px 15px 30px rgba(255, 255, 255, 0.2);
            animation: globeRotate 25s linear infinite;
        }

        @keyframes globeRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Yorug'lik effekti */
        .globe::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 45%;
            height: 55%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        /* Soya effekti */
        .globe::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 70% 70%, rgba(0, 0, 0, 0.25) 0%, transparent 50%);
        }

        /* Globus halqasi - O'zbek ranglari */
        .globe-ring {
            position: absolute;
            width: 300px;
            height: 110px;
            border: 10px solid;
            border-image: linear-gradient(135deg, #1eb2a6, #ffffff, #67b279) 1;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(-15deg);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2);
        }

        .globe-ring::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.3);
        }

        /* Globus tayanchig'i */
        .globe-stand {
            width: 130px;
            height: 10px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.2) 100%);
            border-radius: 50%;
            margin-top: 25px;
            box-shadow: 
                0 5px 20px rgba(0, 0, 0, 0.4),
                inset 0 -2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .globe-stand::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 35px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.2));
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                -2px 2px 10px rgba(0, 0, 0, 0.3),
                inset -2px -2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Qit'alar - O'zbekiston qit'asi bilan */
        .continent {
            position: absolute;
            background: #67b279;
            border-radius: 40% 60% 50% 50%;
            opacity: 0.9;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Osiyo (O'zbekiston joylashgan) */
        .continent-1 {
            width: 70px;
            height: 60px;
            top: 28%;
            left: 32%;
            transform: rotate(20deg);
            background: #5fb83f;
        }

        /* Afrika */
        .continent-2 {
            width: 45px;
            height: 50px;
            top: 48%;
            right: 22%;
            transform: rotate(-15deg);
            border-radius: 50% 40% 60% 50%;
        }

        /* Janubiy Amerika */
        .continent-3 {
            width: 38px;
            height: 35px;
            bottom: 32%;
            left: 25%;
            transform: rotate(45deg);
        }

        /* O'zbekiston belgisi */
        .uzbekistan-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #cc0000;
            border-radius: 50%;
            top: 35%;
            left: 48%;
            box-shadow: 
                0 0 10px rgba(204, 0, 0, 0.8),
                0 0 20px rgba(204, 0, 0, 0.5);
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* Dekorativ doira - O'zbek naqshlari */
        .decorative-circle {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 50%;
            right: -60px;
            transform: translateY(-50%);
            z-index: 1;
        }

        .circle-pattern {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .pattern-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* O'zbek milliy naqshi */
        .circle-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background-image: 
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 15deg,
                    rgba(255, 255, 255, 0.2) 15deg 30deg
                );
            mask-image: radial-gradient(circle, transparent 35%, black 38%, black 100%);
        }

        /* Milliy bezak */
        .ornament {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50% 50% 0 50%;
        }

        .ornament-1 {
            top: -15px;
            right: 70px;
            transform: rotate(45deg);
        }

        .ornament-2 {
            top: 70px;
            right: -15px;
            transform: rotate(135deg);
        }

        .ornament-3 {
            bottom: 70px;
            right: -15px;
            transform: rotate(225deg);
        }

        .ornament-4 {
            bottom: -15px;
            right: 70px;
            transform: rotate(315deg);
        }

        /* Ma'lumot kartochkalari */
        .info-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .info-card h3 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .info-card p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        /* Bayroq ranglari - kartochkalar */
        .info-card:nth-child(1) { border-left: 5px solid #1eb2a6; }
        .info-card:nth-child(2) { border-left: 5px solid #ffffff; }
        .info-card:nth-child(3) { border-left: 5px solid #67b279; }
        .info-card:nth-child(4) { border-left: 5px solid #cc0000; }

        /* Responsive */
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 30px;
            }

            h1 {
                font-size: 3.5rem;
                text-align: center;
            }

            .subtitle {
                text-align: center;
            }

            .content {
                text-align: center;
            }

            .visual {
                order: -1;
            }

            .decorative-circle {
                right: 50%;
                transform: translate(50%, -50%);
            }

            .info-section {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }

            .button {
                font-size: 1.2rem;
                padding: 15px 35px;
            }

            .globe {
                width: 170px;
                height: 170px;
            }

            .globe-ring {
                width: 230px;
                height: 85px;
            }

            .globe-stand {
                width: 100px;
            }

            .decorative-circle {
                width: 220px;
                height: 220px;
            }

            .info-section {
                grid-template-columns: 1fr;
            }

            .globe-container {
                width: 250px;
                height: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>GEOGRAFIYA</h1>
            <p class="subtitle">Yer Sayyorasini 3D da Kashf Eting</p>
            
            <a href="https://earth.google.com/web/@41.3111,69.2797,470a,10000000d,35y,0h,0t,0r" class="button">
                3D Kashf Eting
            </a>

            <div class="description">
                <strong>Bu sizga Yer shahrining har bir nuqtasiga virtual sayohat qilish imkonini beradi!</strong>
                <br><br>
                Google Earth orqali O'zbekistonni va butun dunyoni 3D formatda ko'ring.
            </div>
        </div>

        <div class="visual">
            <div class="globe-container">
                <div class="globe">
                    <div class="continent continent-1"></div>
                    <div class="continent continent-2"></div>
                    <div class="continent continent-3"></div>
                    <div class="uzbekistan-marker"></div>
                    <div class="globe-ring"></div>
                </div>
                <div class="globe-stand"></div>
            </div>

            <div class="decorative-circle">
                <div class="circle-pattern">
                    <div class="pattern-inner"></div>
                </div>
                <div class="ornament ornament-1"></div>
                <div class="ornament ornament-2"></div>
                <div class="ornament ornament-3"></div>
                <div class="ornament ornament-4"></div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-card">
                <h3>510M</h3>
                <p>Yer yuzasi (km²)</p>
            </div>
            <div class="info-card">
                <h3>7</h3>
                <p>Qit'alar soni</p>
            </div>
            <div class="info-card">
                <h3>195</h3>
                <p>Davlatlar soni</p>
            </div>
            <div class="info-card">
                <h3>🇺🇿</h3>
                <p>O'zbekiston</p>
            </div>
        </div>
    </div>
</body>
</html>
