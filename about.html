<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizning Victus Jamoasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 150, 255, 0.03) 2px, rgba(0, 150, 255, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 150, 255, 0.03) 2px, rgba(0, 150, 255, 0.03) 4px);
            pointer-events: none;
        }

        .container {
            max-width: 1500px;
            width: 100%;
            background: rgba(15, 15, 25, 0.8);
            border: 2px solid rgba(0, 150, 255, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,10 L90,10 L90,30 M90,50 L90,90 L10,90 M30,10 L30,50 M50,30 L70,30 M50,70 L70,70" stroke="rgba(0,150,255,0.1)" stroke-width="2" fill="none"/></svg>');
            opacity: 0.3;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            font-size: 3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-weight: bold;
        }

        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            margin: 0 auto 50px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .team-member {
            background: rgba(20, 20, 35, 0.6);
            border: 2px solid rgba(0, 150, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .team-member::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .team-member:hover::before {
            left: 100%;
        }

        .team-member:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .photo-placeholder {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #2d2d44);
            border: 3px solid #00d4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            overflow: hidden;
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-name {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .member-role {
            color: #00d4ff;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
                letter-spacing: 4px;
            }

            .container {
                padding: 30px 20px;
            }

            .team-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 20px;
            }

            .photo-placeholder {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BIZNING VICTUS JAMOASI</h1>
        <div class="divider"></div>
        
        <div class="team-grid">
            <div class="team-member">
                <div class="photo-placeholder"><img src="./photo_2026-02-08_15-46-29.jpg" alt=""></div>
                <div class="member-name">Nasrullayev</div>
                <div class="member-role">Aminjon</div>
            </div>

            <div class="team-member">
                <div class="photo-placeholder"><img src="./photo_2026-02-08_15-42-06.jpg" alt=""></div>
                <div class="member-name">Xudoyberdiyev</div>
                <div class="member-role">Zarrux</div>
            </div>

            <div class="team-member">
                <div class="photo-placeholder"><img src="./photo_2026-02-08_15-46-17.jpg" alt=""></div>
                <div class="member-name">Xamrokulova</div>
                <div class="member-role">Xosiyatbonu</div>
            </div>

            <div class="team-member">
                <div class="photo-placeholder"><img src="./photo_2026-02-08_15-46-44.jpg" alt=""></div>
                <div class="member-name">Sohibova</div>
                <div class="member-role">Jasmina</div>
            </div>

            <div class="team-member">
                <div class="photo-placeholder"><img src="./photo_2026-02-08_15-46-38.jpg" alt=""></div>
                <div class="member-name">Olimjonov</div>
                <div class="member-role">Ulug'bek</div>
            </div>
        </div>
    </div>
</body>
</html>
